# Redis keeps the stock counters of inventory. Plain TCP inside the mesh.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: demo
  labels:
    app: redis
    service: redis
spec:
  ports:
  - port: 6379
    name: tcp-redis
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: demo
  labels:
    app: redis
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      version: v1
  template:
    metadata:
      labels:
        app: redis
        version: v1
    spec:
      containers:
      - name: redis
        image: redis:8-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
---
# Traffic from outside the mesh comes in through the Istio ingress gateway.
# A Gateway opens the port, a VirtualService says where the requests go.
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: demo-gateway
  namespace: demo
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend
  namespace: demo
spec:
  hosts:
  - "*"
  gateways:
  - demo-gateway
  http:
  - route:
    - destination:
        host: frontend
        port:
          number: 8080
---
# Two versions of reviews. The DestinationRule names them, the
# VirtualService sends 80% of the requests to v1 and 20% to v2.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: reviews
  namespace: demo
spec:
  host: reviews
  subsets:
  - name: v1
    labels:
      version: v1
  - name: v2
    labels:
      version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: reviews
  namespace: demo
spec:
  hosts:
  - reviews
  http:
  - route:
    - destination:
        host: reviews
        subset: v1
      weight: 80
    - destination:
        host: reviews
        subset: v2
      weight: 20
---
# Background customers. Outside the mesh on purpose: no istio-injection
# label, so no sidecar, and the requests enter through the ingress gateway.
apiVersion: v1
kind: Namespace
metadata:
  name: loadgen
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: loadgen
  labels:
    app: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
      - name: loadgen
        image: kiali-tracing-tutorial/mesh-pizza:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVICE
          value: loadgen
        - name: TARGET
          value: http://istio-ingressgateway.istio-system.svc.cluster.local
        - name: REQUESTS_PER_SECOND
          value: "3"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
