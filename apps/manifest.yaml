# Mesh Pizza: the demo of the tutorial. Fifteen workloads in the demo
# namespace, all inside the Istio mesh, plus a load generator outside it.
#
#   loadgen -> ingress gateway -> frontend -+-> menu -+-> pricing -> promotions
#                                           |         '-> reviews (v1 80%, v2 20%) -> ratings (v2 only)
#                                           |
#                                           '-> orders -+-> inventory -> redis (TCP)
#                                                       +-> payments -> fraud        payments fails 15% of the charges
#                                                       +-> kitchen -> inventory
#                                                       +-> delivery -> maps         maps is slow 20% of the time
#                                                       '-> notifications
#
# Every service runs the same image, built from this directory by
# `make prepare` (or `make build load`). SERVICE picks the module to run.
apiVersion: v1
kind: Namespace
metadata:
  name: demo
  labels:
    # Tells Istio to inject its proxy into every pod of this namespace.
    istio-injection: enabled
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: demo
  labels:
    app: frontend
    service: frontend
spec:
  ports:
  - port: 8080
    name: http
  selector:
    app: frontend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: demo
  labels:
    account: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: demo
  labels:
    app: frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: v1
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      serviceAccountName: frontend
      containers:
      - name: frontend
        image: kiali-tracing-tutorial/mesh-pizza:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: SERVICE
          value: frontend
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
