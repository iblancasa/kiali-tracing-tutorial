apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: demo-gateway
  namespace: demo
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: demo
  namespace: demo
spec:
  hosts:
  - "*"
  gateways:
  - demo-gateway
  http:
  - match:
    - uri:
        exact: /no-header-forwarding
    route:
    - destination:
        host: app1
        port:
          number: 9080
  - match:
    - uri:
        exact: /header-forwarding
    route:
    - destination:
        host: app1
        port:
          number: 9080
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: app1
  namespace: demo
spec:
  host: app1
  subsets:
  - name: v1
    labels:
      version: v1