# The Istio addons create ClusterIP services for Prometheus and Grafana.
# These two extra services expose the same pods on fixed NodePorts, which
# kind maps to localhost:9090 and localhost:3000 (see kind.yaml).
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: istio-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: istio-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
