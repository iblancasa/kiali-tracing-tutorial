# Mesh-wide tracing: every Envoy proxy (sidecars and the ingress gateway)
# reports spans to the "otel" provider declared in infra/istio.yaml.
# 100% sampling is fine for a tutorial. Do not copy it to production.
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: mesh-default
  namespace: istio-system
spec:
  tracing:
    - providers:
        - name: otel
      randomSamplingPercentage: 100
