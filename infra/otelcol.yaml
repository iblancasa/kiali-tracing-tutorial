# OpenTelemetry Collector, managed by the OpenTelemetry operator.
# The operator creates a Deployment and a Service called otel-collector.
#
# It receives OTLP from the Envoy proxies (gRPC, 4317) and, from step 4,
# from the auto-instrumented applications (HTTP, 4318). Everything goes to
# Jaeger.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel
  namespace: istio-system
spec:
  mode: deployment
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      otlp_grpc/jaeger:
        endpoint: jaeger.istio-system.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_grpc/jaeger]
