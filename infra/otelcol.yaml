apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: instance
  namespace: istio-system
spec:
  observability:
    metrics:
      enableMetrics: false
  config:
    receivers:
      zipkin: {}
      otlp:
        protocols:
          grpc: {}
          http: {}
    processors:

    exporters:
      otlp:
        endpoint: jaeger-collector:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [zipkin,otlp]
          processors: []
          exporters: [otlp]
