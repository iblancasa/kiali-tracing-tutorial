# Jaeger v2, single binary, traces in memory. Good for a tutorial, gone on
# restart. UI and HTTP API on 16686 (localhost:16686 through kind), gRPC
# query API on 16685 (Kiali reads traces from it), OTLP in on 4317.
#
# Jaeger v2 is built on the OpenTelemetry Collector framework, so its config
# has the same shape: receivers, processors, exporters, pipelines, plus
# Jaeger's own extensions for storage and the query service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jaeger-config
  namespace: istio-system
data:
  config.yaml: |
    service:
      extensions: [jaeger_storage, jaeger_query, healthcheckv2]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [jaeger_storage_exporter]
    extensions:
      healthcheckv2:
        use_v2: true
        http:
          endpoint: 0.0.0.0:13133
      jaeger_query:
        storage:
          traces: memory_store
        ui:
          config_file: /etc/jaeger/ui.json
        http:
          endpoint: 0.0.0.0:16686
        grpc:
          endpoint: 0.0.0.0:16685
      jaeger_storage:
        backends:
          memory_store:
            memory:
              max_traces: 50000
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      jaeger_storage_exporter:
        trace_storage: memory_store
  ui.json: |
    {
      "dependencies": { "menuEnabled": true }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: istio-system
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.23.0
          args: ["--config", "/etc/jaeger/config.yaml"]
          ports:
            - name: ui
              containerPort: 16686
            - name: grpc-query
              containerPort: 16685
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /status
              port: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/jaeger
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: jaeger-config
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: istio-system
  labels:
    app: jaeger
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: http-query
      port: 16686
      targetPort: 16686
      nodePort: 30686
    - name: grpc-query
      port: 16685
      targetPort: 16685
    - name: grpc-otlp
      port: 4317
      targetPort: 4317
    - name: http-otlp
      port: 4318
      targetPort: 4318
